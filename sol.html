<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOL Cycle Comparison</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      padding: 20px;
    }

    .coin-tabs {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 20px;
    }

    .coin-tabs .tab {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #888;
      padding: 8px 20px;
      border-radius: 6px 6px 0 0;
      text-decoration: none;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }

    .coin-tabs .tab:hover {
      background: #2a2a4e;
      color: #e0e0e0;
    }

    .coin-tabs .tab.active {
      background: #2a2a4e;
      color: #fff;
      border-bottom-color: #2a2a4e;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .controls button {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .controls button:hover { background: #2a2a4e; }

    .zoom-hint {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-bottom: 12px;
    }

    #legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .legend-item.hidden { opacity: 0.3; }
    .legend-item:hover { background: rgba(255,255,255,0.05); }

    .legend-swatch {
      width: 14px;
      height: 3px;
      border-radius: 2px;
      display: inline-block;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 40px;
    }

    .chart-container svg { background: #0a0a1a; }

    .axis text { fill: #888; font-size: 11px; }
    .axis line, .axis path { stroke: #333; }
    .grid line { stroke: #1a1a2e; stroke-opacity: 0.8; }
    .grid path { display: none; }

    .axis-label { fill: #888; font-size: 12px; }
    .chart-title { fill: #fff; font-size: 15px; font-weight: 600; }

    .crosshair {
      stroke: #555;
      stroke-width: 1;
      stroke-dasharray: 3,3;
    }

    .tooltip {
      position: absolute;
      background: rgba(20, 20, 40, 0.95);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
      max-width: 280px;
    }

    .brush .selection {
      fill: rgba(100, 100, 255, 0.2);
      stroke: rgba(100, 100, 255, 0.5);
      stroke-width: 1;
    }
    .brush .handle { display: none; }
  </style>
</head>
<body>
  <nav class="coin-tabs">
    <a href="index.html" class="tab">BTC</a>
    <a href="eth.html" class="tab">ETH</a>
    <a href="sol.html" class="tab active">SOL</a>
    <a href="xrp.html" class="tab">XRP</a>
  </nav>

  <h1>Solana Cycle Comparison</h1>

  <div class="controls">
    <button id="range-toggle">Range: Top &rarr; Bottom</button>
    <button id="mode-toggle">Percentage</button>
    <button id="sd-toggle">SD: +/-1 &amp; +/-2</button>
    <button id="log-toggle">Scale: Linear</button>
  </div>

  <div id="legend"></div>

  <div class="zoom-hint">Drag to zoom &middot; Double-click to reset</div>

  <div id="chart" class="chart-container"></div>

  <h2 style="text-align:center;color:#fff;margin-top:40px;font-size:1.1rem;">Midterm Year Drawdown</h2>
  <div id="midterm-legend" style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:16px 0;"></div>
  <div class="zoom-hint">Drag to zoom &middot; Double-click to reset</div>
  <div id="midterm-chart" class="chart-container"></div>

  <script type="module" src="js/sol-main.js"></script>
</body>
</html>
