<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Bear Market Comparison</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .controls button {
      background: #1a1a2e;
      border: 1px solid #2a2a4e;
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .controls button:hover { background: #2a2a4e; }

    #legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .legend-item.hidden { opacity: 0.3; }
    .legend-item:hover { background: rgba(255,255,255,0.05); }

    .legend-swatch {
      width: 14px;
      height: 3px;
      border-radius: 2px;
      display: inline-block;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 40px;
    }

    .chart-container svg { background: #0a0a1a; }

    .axis text { fill: #888; font-size: 11px; }
    .axis line, .axis path { stroke: #333; }
    .grid line { stroke: #1a1a2e; stroke-opacity: 0.8; }
    .grid path { display: none; }

    .axis-label { fill: #888; font-size: 12px; }
    .chart-title { fill: #fff; font-size: 15px; font-weight: 600; }

    .crosshair {
      stroke: #555;
      stroke-width: 1;
      stroke-dasharray: 3,3;
    }

    .tooltip {
      position: absolute;
      background: rgba(20, 20, 40, 0.95);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <h1>Bitcoin Cycle Comparison</h1>

  <div class="controls">
    <button id="mode-toggle">Percentage</button>
    <button id="sd-toggle">SD: +/-1 &amp; +/-2</button>
    <button id="log-toggle">Scale: Linear</button>
  </div>

  <div id="legend"></div>

  <div id="bear-chart" class="chart-container"></div>
  <div id="bull-chart" class="chart-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
